name: Shadow Delegated SBF Build

on:
  workflow_dispatch:
  push:
    paths:
      - "solana/shadow-delegated-vault/**"
      - "src/internal-copy-engine.mjs"
      - "tests/delegated-build-config.test.mjs"
      - ".github/workflows/shadow-delegated-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static Shadow checks
        run: |
          node --check server.mjs
          node --check src/internal-copy-engine.mjs
          node --check public/execution-authorize.js
          node --check public/execution-wallet-24x7.js
          node --test tests/delegated-build-config.test.mjs
          node solana/shadow-delegated-vault/tests/policy-model.mjs

      - name: Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential curl pkg-config libssl-dev libudev-dev

      - name: Install official Agave 4.3.0
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Toolchain diagnostics
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          cargo-build-sbf --version
          platform-tools --version || true
          ldd --version | head -1

      - name: Clean dependency resolution
        working-directory: solana/shadow-delegated-vault
        shell: bash
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile
          grep -A2 'name = "solana-program"' Cargo.lock | head -3
          grep -A2 'name = "anchor-lang"' Cargo.lock | head -3
          grep -A2 'name = "anchor-spl"' Cargo.lock | head -3

      - name: Build delegated vault SBF
        working-directory: solana/shadow-delegated-vault
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          mkdir -p target/deploy
          cargo build-sbf             --manifest-path programs/shadow_delegated_vault/Cargo.toml             --sbf-out-dir target/deploy
          test -s target/deploy/shadow_delegated_vault.so
          sha256sum target/deploy/shadow_delegated_vault.so
          echo "SHADOW_DELEGATED_SBF_BUILD_OK"

      - name: Upload verified SBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-delegated-vault-${{ github.sha }}
          path: |
            solana/shadow-delegated-vault/target/deploy/shadow_delegated_vault.so
            solana/shadow-delegated-vault/Cargo.lock
          if-no-files-found: error
          retention-days: 14
